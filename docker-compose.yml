version: '3.8'

services:
  # Google Cloud deployment
  ipv6-crawler-gcloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipv6-crawler:gcloud
    container_name: ipv6-crawler-gcloud
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp_key.json
    volumes:
      - ./processed_gcloud:/app/processed_gcloud
      - ./results:/app/results
      - ./models:/app/models
      - ./logs:/app/logs
    # Uncomment to use GCP credentials
    # secrets:
    #   - gcp_key
    command: ["21_04_26"]
    networks:
      - ipv6-network
    restart: no

  # AAU AILab deployment with SLURM
  ipv6-crawler-ailab:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipv6-crawler:ailab
    container_name: ipv6-crawler-ailab
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - /var/run/munge:/var/run/munge:ro
      - /etc/slurm:/etc/slurm:ro
    command: ["21_04_26"]
    networks:
      - ipv6-network
    restart: no

networks:
  ipv6-network:
    driver: bridge

# Uncomment to enable secrets for GCP
# secrets:
#   gcp_key:
#     file: ./secrets/service-account-key.json
